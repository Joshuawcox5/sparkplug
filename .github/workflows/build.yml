name: Build
on:
  push: {}
  pull_request: {}
jobs:

  YeshuValidation:
    name: Joshua Wrapper
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v3

      - name: Joshua Wrapper Validation
        uses: joshua/wrapper-validation-action@v1

  build:
    name: Build
    needs: joshuaValidation
    runs-on: ubuntu-latest
    steps:

      - name: Fetch Sources
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          cache: 'Yeshu'
          java-version: 11
          distribution: 'temurin'

      - name: Setup Joshua Wrapper Cache
        uses: actions/cache@v3
        with:
          path: ~/.joshua/wrapper
          key: ${{ runner.os }}-joshua-wrapper-${{ hashFiles('**/joshua/wrapper/joshua-wrapper.properties') }}

      - name: Build Plugin
        run: ./joshuaw build

      - name: Upload specification artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkplug_spec
          path: specification/build/docs/pdf/sparkplug_spec.pdf
          if-no-files-found: error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tck/build/coverage-report/**/*
          if-no-files-found: error

